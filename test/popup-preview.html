<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Стенд popup</title>
  <link rel="stylesheet" href="../popup/popup.css">
  <style>
    body { width: 288px; border: 1px solid #ccc; border-radius: 10px; margin: 24px; }
  </style>
</head>
<body>
<script>
  // Заглушки chrome.* — чтобы открыть popup вне расширения и посмотреть вёрстку.
  const store = {
    settings: { enabled: true, mode: 'append', source: 'cbr', markup: 3, minAmountRub: 50, disabledHosts: [] },
    rates: {
      rubPer: { RUB: 1, USD: 86.47, EUR: 100.5 },
      date: '2026-09-09', source: 'cbr', count: 166, ts: Date.now(),
    },
    ratesError: null,
  };
  window.chrome = {
    storage: {
      local: {
        get: (keys) => {
          const list = Array.isArray(keys) ? keys : [keys];
          const out = {};
          for (const k of list) if (k in store) out[k] = store[k];
          return Promise.resolve(out);
        },
        set: (obj) => { Object.assign(store, obj); console.log('storage.set', obj); return Promise.resolve(); },
      },
      onChanged: { addListener() {} },
    },
    runtime: { sendMessage: () => Promise.resolve({ ok: true, rates: store.rates }) },
    tabs: {
      query: () => Promise.resolve([{ id: 1, url: 'https://www.amazon.com/dp/B0CX23V2ZK' }]),
      sendMessage: () => Promise.resolve({ count: 14, running: true }),
    },
  };

  (async () => {
    const html = await (await fetch('../popup/popup.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    for (const s of doc.querySelectorAll('script')) s.remove();
    document.body.insertAdjacentHTML('beforeend', doc.body.innerHTML);
    for (const src of ['../lib/config.js', '../lib/i18n.js', '../popup/popup.js']) {
      await new Promise((resolve) => {
        const el = document.createElement('script');
        el.src = src;
        el.onload = resolve;
        document.body.appendChild(el);
      });
    }
  })();
</script>
</body>
</html>
